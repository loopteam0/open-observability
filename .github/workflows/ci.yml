name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Lint all YAML configuration files
  # -----------------------------------------------------------------------
  lint:
    name: Lint YAML configs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint

      - name: Lint docker-compose.yml
        run: yamllint -d relaxed docker-compose.yml

      - name: Lint OpenTelemetry Collector config
        run: yamllint -d relaxed otel-collector/otel-collector-config.yml

      - name: Lint Prometheus config
        run: yamllint -d relaxed prometheus/prometheus.yml

      - name: Lint Loki config
        run: yamllint -d relaxed loki/loki-config.yml

      - name: Lint Grafana datasources
        run: yamllint -d relaxed grafana/provisioning/datasources/datasources.yml

  # -----------------------------------------------------------------------
  # Job 2: Start the stack and verify every service is healthy
  # -----------------------------------------------------------------------
  integration:
    name: Integration – stack health checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start the observability stack
        run: docker compose up -d

      - name: Wait for services to become ready (up to 90 s)
        run: |
          echo "Waiting for all services to be healthy..."
          timeout 90 bash -c '
            while ! docker compose ps --format json | python3 -c "
          import sys, json
          services = [json.loads(l) for l in sys.stdin if l.strip()]
          # All containers must be running (not exited/starting)
          not_running = [s[\"Name\"] for s in services if s.get(\"State\") not in (\"running\",)]
          if not_running:
              print(\"Not yet running:\", not_running)
              sys.exit(1)
          print(\"All containers are running.\")
            "; do
              echo "  ... still waiting"
              sleep 5
            done
          '

      - name: Check – Prometheus health
        run: |
          curl --retry 10 --retry-delay 5 --retry-all-errors \
               --fail --silent --show-error \
               http://localhost:9090/-/healthy
          echo " Prometheus is healthy"

      - name: Check – Loki ready
        run: |
          curl --retry 10 --retry-delay 5 --retry-all-errors \
               --fail --silent --show-error \
               http://localhost:3100/ready
          echo " Loki is ready"

      - name: Check – Jaeger UI reachable
        run: |
          curl --retry 10 --retry-delay 5 --retry-all-errors \
               --fail --silent --show-error \
               http://localhost:16686/
          echo " Jaeger UI is reachable"

      - name: Check – Grafana health
        run: |
          curl --retry 10 --retry-delay 5 --retry-all-errors \
               --fail --silent --show-error \
               http://localhost:3000/api/health
          echo " Grafana is healthy"

      - name: Check – OTel Collector health
        run: |
          curl --retry 10 --retry-delay 5 --retry-all-errors \
               --fail --silent --show-error \
               http://localhost:13133/
          echo " OTel Collector is healthy"

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down the stack
        if: always()
        run: docker compose down -v
